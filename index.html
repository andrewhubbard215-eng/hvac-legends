<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HVAC Legends</title>
</head>
<body>
<p id="boot">Opening the shop floor…</p>
<script>
fetch("https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html")
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
    var hook = '<script>setInterval(function(){var s=document.getElementById("screen-sandbox");var on=s&&s.classList.contains("active");var box=document.getElementById("parts-real");if(!on){if(box)box.style.display="none";return;}if(box){box.style.display="block";return;}box=document.createElement("div");box.id="parts-real";box.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:200;background:#121820;border-top:1px solid #c9a227;padding:8px";box.innerHTML="<div style=display:flex;gap:8px;margin-bottom:6px><button type=button id=parts-left style=min-height:44px;flex:1>More left</button><button type=button id=parts-right style=min-height:44px;flex:1>More right</button></div><div id=parts-row style=display:flex;gap:8px;overflow-x:scroll></div>";document.body.appendChild(box);var row=document.getElementById("parts-row");var names=["Scroll compressor","Outdoor condenser","TXV","Piston","Evaporator","Filter-drier","Accumulator","Disconnect","Contactor","Capacitor","Transformer"];names.forEach(function(n){var b=document.createElement("button");b.type="button";b.textContent=n;b.style.cssText="flex:0 0 auto;min-width:120px;min-height:44px;background:#1c2630;color:#f3e2b0;border:1px solid #3d4a58;border-radius:8px";b.onclick=function(){var items=document.querySelectorAll(".sb-item,button");for(var i=0;i<items.length;i++){if(items[i]!==b&&(items[i].textContent||"").indexOf(n.slice(0,8))>=0){items[i].click();break;}}};row.appendChild(b);});document.getElementById("parts-left").onclick=function(){row.scrollLeft-=180};document.getElementById("parts-right").onclick=function(){row.scrollLeft+=180};},700);<' + '/script>';
    t = t.replace('<base href="/legends/" />', base);
    t = t.replace("</body>", hook + "</body>");
    document.open();
    document.write(t);
    document.close();
  })
  .catch(function () {
    var n = document.getElementById("boot");
    if (n) n.textContent = "Shop floor did not load. Close this tab and open the new link.";
  });
</script>
</body>
</html>
