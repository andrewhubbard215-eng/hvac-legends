<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HVAC Legends</title>
</head>
<body>
<p id="boot">Opening the shop floor…</p>
<script>
fetch("https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html")
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
    var hook = '<style id="layout-fit">#student-dock,.sb-labboard{display:none !important}#clock-in-now{position:fixed;left:12px;right:12px;bottom:16px;z-index:120;min-height:48px;border:0;border-radius:12px;background:#e23b4a;color:#fff;font-weight:700;font-size:18px}#sandbox-root .sb-items,#sb-items,.sb-items{display:flex !important;flex-wrap:nowrap !important;overflow-x:auto !important;-webkit-overflow-scrolling:touch !important;touch-action:pan-x !important}</style><script>setInterval(function(){var door=document.getElementById("screen-title")||document.getElementById("title-card");var onDoor=door&&!door.classList.contains("hidden")&&door.offsetParent!==null;var b=document.getElementById("clock-in-now");if(!onDoor){if(b)b.style.display="none";return;}if(!b){b=document.createElement("button");b.id="clock-in-now";b.type="button";b.textContent="Clock In";b.onclick=function(){var old=document.querySelector("#btn-clockin,.btn-clockin,[data-clockin]");if(old){old.click();return;}if(window.ltCloseCard)window.ltCloseCard();if(window.ltGo)window.ltGo("hub");b.style.display="none";};document.body.appendChild(b);}b.style.display="block";},600);<' + '/script>';
    t = t.replace('<base href="/legends/" />', base);
    t = t.replace("</head>", hook + "</head>");
    document.open();
    document.write(t);
    document.close();
  })
  .catch(function () {
    var n = document.getElementById("boot");
    if (n) n.textContent = "Shop floor did not load. Close this tab and open the new link.";
  });
</script>
</body>
</html>
