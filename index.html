<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HVAC Legends</title>
</head>
<body>
  <p id="boot">Opening the shop floor…</p>
  <script>
    var FIX = '<style id="phone-unblock">'
      + '#student-dock{display:none !important;}'
      + '#sandbox-root .sb-palette,#sb-palette,#sb-rail,.sb-rail{position:relative !important;z-index:80 !important;max-height:42vh !important;min-height:132px !important;overflow-x:auto !important;overflow-y:auto !important;-webkit-overflow-scrolling:touch !important;touch-action:pan-x pan-y !important;}'
      + '#sandbox-root .sb-items,#sandbox-root #sb-items,#sb-items,.sb-items{display:flex !important;flex-direction:row !important;flex-wrap:nowrap !important;overflow-x:scroll !important;overflow-y:hidden !important;-webkit-overflow-scrolling:touch !important;touch-action:pan-x !important;gap:8px !important;width:100% !important;max-width:100% !important;}'
      + '#sandbox-root .sb-item,.sb-item{flex:0 0 128px !important;min-width:128px !important;width:128px !important;touch-action:pan-x !important;}'
      + '</style>'
      + '<script>'
      + '(function(){function arm(){var trays=document.querySelectorAll("#sb-items,.sb-items,#sb-palette,.sb-palette,#sb-rail,.sb-rail");for(var i=0;i<trays.length;i++){var tray=trays[i];tray.style.overflowX="scroll";tray.style.webkitOverflowScrolling="touch";tray.style.touchAction="pan-x pan-y";if(tray.dataset.scrollArmed)continue;tray.dataset.scrollArmed="1";tray.addEventListener("touchmove",function(e){e.stopPropagation();},{passive:true});}}var items=document.querySelectorAll(".sb-item");for(var j=0;j<items.length;j++){items[j].style.flex="0 0 128px";items[j].style.minWidth="128px";}}setInterval(arm,500);})();'
      + '<\/script>';
    fetch('https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html')
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
        t = t.replace('<base href="/legends/" />', base);
        t = t.replace('</head>', FIX + '</head>');
        document.open(); document.write(t); document.close();
      })
      .catch(function () {
        var n = document.getElementById('boot');
        if (n) n.textContent = 'Shop floor did not load. Close this tab and open the new link.';
      });
  </script>
</body>
</html>
