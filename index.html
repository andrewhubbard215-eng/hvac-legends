<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HVAC Legends</title>
</head>
<body>
<p id="boot">Opening the shop floor…</p>
<script>
var FIX = '<style id="phone-unblock">#student-dock,.sb-labboard{display:none !important}#parts-move{display:flex;gap:8px;margin:8px;position:relative;z-index:90}#parts-move button{min-height:44px;flex:1}</style>'
  + '<script>(function(){function tray(){return document.querySelector("#sb-items")||document.querySelector(".sb-items")||document.querySelector("#sb-rail");}function arm(){var box=tray();if(!box)return;box.style.overflowX="scroll";box.style.flexWrap="nowrap";box.style.touchAction="pan-x";var items=box.querySelectorAll(".sb-item");for(var i=0;i<items.length;i++){items[i].style.flex="0 0 128px";items[i].style.minWidth="128px";}if(document.getElementById("parts-move"))return;var bar=document.createElement("div");bar.id="parts-move";bar.innerHTML="<button type=button id=parts-back>Back</button><button type=button id=parts-more>More parts</button>";box.parentNode.insertBefore(bar,box);document.getElementById("parts-back").onclick=function(){box.scrollLeft-=160;};document.getElementById("parts-more").onclick=function(){box.scrollLeft+=160;};box.addEventListener("touchmove",function(e){e.stopPropagation();},{capture:true,passive:true});}setInterval(arm,600);})();<\/script>';
fetch('https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html').then(function(r){return r.text()}).then(function(t){var base='<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';t=t.replace('<base href="/legends/" />',base);t=t.replace('</body>',FIX+'</body>');document.open();document.write(t);document.close()}).catch(function(){var n=document.getElementById('boot');if(n)n.textContent='Shop floor did not load. Close this tab and open the new link.';});
</script>
</body>
</html>
