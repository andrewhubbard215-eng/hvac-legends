<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HVAC Legends</title>
</head>
<body>
<p id="boot">Opening the shop floor…</p>
<script>
var FIX = '<style>#parts-real{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#121820;border-top:1px solid #c9a227;padding:8px}#parts-real .row{display:flex;gap:8px;overflow-x:scroll;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;white-space:nowrap;padding-bottom:8px}#parts-real button{flex:0 0 auto;min-height:44px}#parts-real .chip{min-width:120px;background:#1c2630;color:#f3e2b0;border:1px solid #3d4a58;border-radius:8px;padding:8px}</style><script>(function(){function arm(){if(!document.getElementById("sandbox-root"))return;if(document.getElementById("parts-real"))return;var items=document.querySelectorAll(".sb-item");if(!items.length)return;var box=document.createElement("div");box.id="parts-real";box.innerHTML="<div style=\"display:flex;gap:8px;margin-bottom:6px\"><button type=button id=parts-left>More left</button><button type=button id=parts-right>More right</button><span style=\"color:#f3e2b0;font-size:12px;align-self:center\">Slide this row. The old tray is stuck.</span></div><div class=row id=parts-row></div>";document.body.appendChild(box);var row=document.getElementById("parts-row");items.forEach(function(el){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=(el.textContent||"Part").replace(/\\s+/g," ").trim().slice(0,32);b.onclick=function(){el.click();};row.appendChild(b);});document.getElementById("parts-left").onclick=function(){row.scrollLeft-=160;};document.getElementById("parts-right").onclick=function(){row.scrollLeft+=160;};}setInterval(arm,800);})();<\/script>';
fetch('https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html').then(function(r){return r.text()}).then(function(t){var base='<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';t=t.replace('<base href="/legends/" />',base);t=t.replace('</body>',FIX+'</body>');document.open();document.write(t);document.close()}).catch(function(){var n=document.getElementById('boot');if(n)n.textContent='Shop floor did not load. Close this tab and open the new link.';});
</script>
</body>
</html>
