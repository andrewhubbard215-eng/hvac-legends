<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HVAC Legends</title>
</head>
<body>
  <p id="boot">Opening the shop floor…</p>
  <script>
    var FIX = '<style id="phone-unblock">'
      + '#screen-title:not(.active){display:none !important;height:0 !important;min-height:0 !important;overflow:hidden !important;}'
      + '#screen-hub.screen.active{display:block !important;position:absolute;inset:0;overflow:auto;background:#14171a;}'
      + '#student-dock{position:fixed !important;left:8px;right:8px;bottom:8px;max-height:52px !important;height:52px !important;overflow:hidden !important;z-index:30 !important;display:flex !important;flex-direction:row !important;align-items:center !important;pointer-events:none !important;background:#14110c;padding:6px !important;}'
      + '#student-dock .btn,#student-dock button{pointer-events:auto !important;min-height:40px !important;}'
      + '#student-dock span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;}'
      + '.sb-palette,.sb-items{position:relative;z-index:40;}'
      + '.sb-labboard{display:none !important;}'
      + '</style>';
    fetch('https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html')
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
        t = t.replace('<base href="/legends/" />', base);
        t = t.replace('</head>', FIX + '</head>');
        document.open(); document.write(t); document.close();
      })
      .catch(function () {
        var n = document.getElementById('boot');
        if (n) n.textContent = 'Shop floor did not load. Close this tab and open the new link.';
      });
  </script>
</body>
</html>
