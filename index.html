<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HVAC Legends</title>
</head>
<body>
  <p id="boot">Opening the shop floor…</p>
  <script>
    var FIX = '<style id="phone-unblock">'
      + '#screen-title:not(.active){display:none !important;height:0 !important;}'
      + '#screen-hub.screen.active{display:block !important;position:absolute;inset:0;overflow:auto;background:#14171a;}'
      + '#student-dock{display:none !important;}'
      + '#sandbox-root .sb-palette{position:relative !important;z-index:60 !important;max-height:34vh !important;min-height:128px !important;overflow-x:auto !important;overflow-y:auto !important;-webkit-overflow-scrolling:touch !important;touch-action:pan-x pan-y !important;padding-bottom:12px !important;}'
      + '#sandbox-root .sb-items,#sandbox-root #sb-items{display:flex !important;flex-direction:row !important;flex-wrap:nowrap !important;overflow-x:auto !important;overflow-y:hidden !important;-webkit-overflow-scrolling:touch !important;touch-action:pan-x !important;gap:8px !important;width:100% !important;padding-bottom:10px !important;}'
      + '#sandbox-root .sb-item{flex:0 0 auto !important;min-width:124px !important;touch-action:pan-x !important;}'
      + '</style>';
    fetch('https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html')
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
        t = t.replace('<base href="/legends/" />', base);
        t = t.replace('</head>', FIX + '</head>');
        document.open(); document.write(t); document.close();
      })
      .catch(function () {
        var n = document.getElementById('boot');
        if (n) n.textContent = 'Shop floor did not load. Close this tab and open the new link.';
      });
  </script>
</body>
</html>
