<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HVAC Legends</title>
</head>
<body>
<p id="boot">Opening the shop floor…</p>
<script>
var FIX = '<script src="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@main/txv-see.js"><\/script>';
fetch("https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html")
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
    t = t.replace('<base href="/legends/" />', base);
    t = t.replace("</body>", FIX + "</body>");
    document.open(); document.write(t); document.close();
  })
  .catch(function () {
    var n = document.getElementById("boot");
    if (n) n.textContent = "Shop floor did not load. Close this tab and open the new link.";
  });
</script>
</body>
</html>
