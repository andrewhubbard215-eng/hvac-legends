<p id="boot">Opening the shop floor…</p>
<script>
fetch("https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html")
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
    var hook = '<style id="meter-fit">#screen-voltmeter.active .vm-meter-sticky,#screen-voltmeter.active .el-lead-lcd{max-height:30vh !important}#screen-voltmeter.active #student-dock{display:none !important}#lead-pic{display:block;width:100%;max-height:140px;background:#121820;border-bottom:1px solid #c9a227}</style><script>setInterval(function(){var root=document.getElementById("screen-voltmeter");if(!root||!root.classList.contains("active")||document.getElementById("lead-pic"))return;var pic=document.createElement("div");pic.id="lead-pic";pic.innerHTML="<svg viewBox=\"0 0 360 120\" width=\"100%\" height=\"120\"><rect width=\"360\" height=\"120\" fill=\"#121820\"/><text x=\"12\" y=\"18\" fill=\"#f3e2b0\" font-size=\"13\">Lead spots</text><circle cx=\"70\" cy=\"70\" r=\"16\" fill=\"#111\" stroke=\"#ccc\"/><text x=\"54\" y=\"98\" fill=\"#ccc\" font-size=\"11\">COM</text><circle cx=\"150\" cy=\"70\" r=\"16\" fill=\"#111\" stroke=\"#e23b4a\"/><text x=\"132\" y=\"98\" fill=\"#e23b4a\" font-size=\"11\">VΩ</text><path d=\"M70 54 V34 H210\" stroke=\"#111\" stroke-width=\"4\"/><path d=\"M150 54 V40 H250\" stroke=\"#e23b4a\" stroke-width=\"4\"/><rect x=\"230\" y=\"28\" width=\"70\" height=\"40\" fill=\"#1c2630\" stroke=\"#c9a227\"/><text x=\"238\" y=\"52\" fill=\"#f3e2b0\" font-size=\"11\">Hot / N</text></svg><p style=\"margin:0;padding:4px 8px;color:#f3e2b0;font-size:13px\">Black in COM. Red in VΩ. Then black on neutral, red on hot.</p>";root.insertBefore(pic,root.firstChild);},700);<' + '/script>';
    t = t.replace('<base href="/legends/" />', base);
    t = t.replace("</head>", hook + "</head>");
    document.open();
    document.write(t);
    document.close();
  })
  .catch(function () {
    var n = document.getElementById("boot");
    if (n) n.textContent = "Shop floor did not load. Close this tab and open the new link.";
  });
</script>
