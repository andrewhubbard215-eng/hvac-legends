<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HVAC Legends</title>
</head>
<body>
<p id="boot">Opening the shop floor…</p>
<script>
fetch("https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html")
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
    var hook = '<style>#what-close{position:fixed;right:8px;bottom:8px;z-index:500;min-height:44px;min-width:72px;background:#8a1e1e;color:#fff;border:0;border-radius:10px}</style><script>function hideNext(){var nodes=document.querySelectorAll("#student-dock,div,section");for(var i=0;i<nodes.length;i++){var el=nodes[i];if(!el||el.id==="what-close")continue;var txt=el.textContent||"";if(txt.indexOf("What next")<0&&txt.indexOf("What's next")<0)continue;if(el.offsetHeight<36||el.offsetHeight>340)continue;el.style.display="none";}}setInterval(function(){var dock=document.getElementById("student-dock");if(dock&&(dock.textContent||"").indexOf("What next")>=0)dock.style.display="none";if(!document.getElementById("what-close")){var b=document.createElement("button");b.id="what-close";b.type="button";b.textContent="Close";b.onclick=hideNext;document.body.appendChild(b);}},500);<' + '/script>';
    t = t.replace('<base href="/legends/" />', base);
    t = t.replace("</body>", hook + "</body>");
    document.open();
    document.write(t);
    document.close();
  })
  .catch(function () {
    var n = document.getElementById("boot");
    if (n) n.textContent = "Shop floor did not load. Close this tab and open the new link.";
  });
</script>
</body>
</html>
