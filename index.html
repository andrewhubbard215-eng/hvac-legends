<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HVAC Legends</title>
</head>
<body>
<p id="boot">Opening the shop floor…</p>
<script>
fetch("https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html")
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
    var hook = '<style id="meter-fit">#voltmeter-root{transform:scale(0.72);transform-origin:top center;max-height:100dvh}#voltmeter-root .el-zoom-work{height:140px !important}#voltmeter-root .el-lead-lcd{font-size:18px !important}#voltmeter-root .vm-coach{max-height:36px !important;overflow:hidden !important}#screen-voltmeter #student-dock{display:none !important}</style>'
      + '<script>setInterval(function(){var root=document.getElementById("voltmeter-root");if(!root)return;root.style.transform="scale(0.72)";root.style.transformOrigin="top center";var work=root.querySelector(".el-zoom-work");if(work)work.style.height="140px";var dock=document.getElementById("student-dock");if(dock)dock.style.setProperty("display","none","important");},600);<' + '/script>';
    t = t.replace('<base href="/legends/" />', base);
    t = t.replace("</head>", hook + "</head>");
    document.open(); document.write(t); document.close();
  })
  .catch(function () {
    var n = document.getElementById("boot");
    if (n) n.textContent = "Shop floor did not load. Close this tab and open the new link.";
  });
</script>
</body>
</html>
