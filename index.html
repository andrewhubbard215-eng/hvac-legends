<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HVAC Legends</title>
</head>
<body>
<p id="boot">Opening the shop floor…</p>
<script>
(function () {
  var href = String(location.href || "");
  var m = href.match(/hvac-legends\/(?:blob|raw|tree)\/([^/?#]+)\//i);
  var ref = (m && m[1]) ? m[1] : "main";
  var cdn = "https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@" + ref + "/";
  var raw = "https://raw.githubusercontent.com/andrewhubbard215-eng/hvac-legends/" + ref + "/";
  function show(t, base) {
    var baseTag = '<base href="' + base + '">';
    var hook = '<script>document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest("a"):null;if(!a)return;var h=a.getAttribute("href")||"";if(h.indexOf("desk.html")<0)return;e.preventDefault();location.href="https://htmlpreview.github.io/?https://github.com/andrewhubbard215-eng/hvac-legends/blob/main/desk.html";},true);<' + '/script>';
    if (t.indexOf('<base href="/legends/" />') >= 0) t = t.replace('<base href="/legends/" />', baseTag);
    else if (t.indexOf("<head>") >= 0) t = t.replace("<head>", "<head>" + baseTag);
    t = t.replace("</body>", hook + "</body>");
    document.open();
    document.write(t);
    document.close();
  }
  function load(url, base) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.text();
    }).then(function (t) { show(t, base); });
  }
  load(cdn + "play.html", cdn).catch(function () {
    return load(raw + "play.html", raw);
  }).catch(function () {
    var n = document.getElementById("boot");
    if (n) n.textContent = "Shop floor did not load. Close this tab and open the new link.";
  });
})();
</script>
</body>
</html>
