<!DOCTYPE html>
<html lang="en">
<head>

<title>HVAC Legends</title>
</head>
<body>
<p id="boot">Opening the shop floor…</p>
<script>
fetch("https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html")
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
    var hook = '<style id="close-trap">#student-dock{display:none !important}#sandbox-root .sb-items,#sb-items,.sb-items{display:flex !important;flex-wrap:nowrap !important;overflow-x:scroll !important;overflow-y:hidden !important;-webkit-overflow-scrolling:touch !important;touch-action:pan-x !important;width:100% !important}#sandbox-root .sb-item{flex:0 0 108px !important;min-width:108px !important}#guide-toggle{position:fixed;right:8px;bottom:8px;z-index:90;min-height:44px;background:#1b1408;color:#f3e2b0;border:1px solid #c9a227;border-radius:10px;padding:8px 12px}</style><script>document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest("a"):null;if(!a)return;if((a.getAttribute("href")||"").indexOf("desk.html")<0)return;e.preventDefault();location.href="https://htmlpreview.github.io/?https://github.com/andrewhubbard215-eng/hvac-legends/blob/2ef970d70fa7756eaeb16f80c3e39249cc3610a3/desk.html";},true);setInterval(function(){if(document.getElementById("guide-toggle"))return;var b=document.createElement("button");b.id="guide-toggle";b.type="button";b.textContent="Guide";b.onclick=function(){var d=document.getElementById("student-dock");if(!d)return;d.style.setProperty("display",d.style.display==="flex"?"none":"flex","important");};document.body.appendChild(b);},800);<' + '/script>';
    t = t.replace('<base href="/legends/" />', base);
    t = t.replace("</body>", hook + "</body>");
    document.open();
    document.write(t);
    document.close();
  })
  .catch(function () {
    var n = document.getElementById("boot");
    if (n) n.textContent = "Shop floor did not load. Close this tab and open the new link.";
  });
</script>
</body>
</html>
