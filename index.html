<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HVAC Legends</title>
</head>
<body>
<p id="boot">Opening the shop floor…</p>
<script>
fetch("https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/index.html")
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var base = '<base href="https://cdn.jsdelivr.net/gh/andrewhubbard215-eng/hvac-legends@70d762ac5981ac8e314ee0954f676e51676545f0/">';
    var pic = '<div id="lead-black" style="display:none;position:fixed;left:8px;right:8px;top:8px;z-index:200;background:#121820;border:1px solid #c9a227;border-radius:12px;padding:8px;color:#f3e2b0"><svg viewBox="0 0 280 90" width="100%" height="90"><rect x="8" y="16" width="70" height="58" rx="8" fill="#0e141b" stroke="#f3e2b0"/><text x="22" y="50" fill="#f3e2b0" font-size="16">COM</text><circle cx="42" cy="12" r="8" fill="#111"/><line x1="42" y1="20" x2="42" y2="40" stroke="#111" stroke-width="6"/><rect x="120" y="16" width="70" height="58" rx="8" fill="#0e141b" stroke="#8a6a10"/><text x="136" y="50" fill="#8a93a0" font-size="14">V ohm</text><text x="200" y="52" fill="#f3e2b0" font-size="14">Black in COM</text></svg></div>';
    var hook = pic + '<style>#screen-voltmeter .el-zoom-card{max-height:140px !important}#screen-voltmeter.active #student-dock{display:none !important}</style><script>setInterval(function(){var root=document.getElementById("screen-voltmeter");var box=document.getElementById("lead-black");if(!box)return;var on=root&&root.classList.contains("active");box.style.display=on?"block":"none";if(on){var dock=document.getElementById("student-dock");if(dock)dock.style.display="none";}},500);<' + '/script>';
    t = t.replace('<base href="/legends/" />', base);
    t = t.replace("</body>", hook + "</body>");
    if (t.indexOf("condenser-lair") === -1) {
      t = t.replace(
        '<div class="hub-grid hub-nav" id="hub-options">',
        '<div class="hub-grid hub-nav" id="hub-options"><a class="mode-card" href="https://andrewhubbard215-eng.github.io/condenser-lair/?skin=legends"><h3>Condenser Lair</h3><p>Move or die. Side job, then the bus.</p></a>'
      );
    }
    document.open();
    document.write(t);
    document.close();
  })
  .catch(function () {
    var n = document.getElementById("boot");
    if (n) n.textContent = "Shop floor did not load. Close this tab and open the new link.";
  });
</script>
</body>
</html>
